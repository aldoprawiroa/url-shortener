<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice | Advanced URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>

    <nav class="navbar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            Slice
        </div>
        <button class="btn btn-outline" id="openLoginBtn">Dashboard</button>
    </nav>

    <main class="container">
        <section class="hero">
            <h1>Smart Links. <br><span class="text-gradient">Boundless Reach.</span></h1>
            <p>The ultimate infrastructure for link management. Fast, secure, and built for the future.</p>
        </section>

        <section class="shortener-container">
            <div class="glass-card main-card">
                <form id="shortenForm">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                            <input type="url" id="longUrl" placeholder="Paste your massive link here..." required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="shortenBtn">Shorten Now</button>
                    </div>

                    <button type="button" class="advanced-toggle" id="toggleAdvanced">
                        <span>Advanced Options</span>
                        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>

                    <div class="advanced-options-wrapper" id="advancedOptions">
                        <div class="advanced-grid">
                            <div class="form-control">
                                <label for="customAlias">Custom Alias</label>
                                <input type="text" id="customAlias" placeholder="e.g., my-campaign">
                            </div>
                            <div class="form-control">
                                <label for="linkPassword">Password Protection</label>
                                <input type="password" id="linkPassword" placeholder="Set a password">
                            </div>
                            <div class="form-control">
                                <label for="expiryDate">Expiry Date</label>
                                <input type="date" id="expiryDate">
                            </div>
                            <div class="form-control toggle-control">
                                <label for="selfDestruct" class="tooltip-container">
                                    Burn after reading (1 click)
                                    <svg class="info-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                                    <span class="tooltip-text">The link will permanently self-destruct and become inaccessible after the first visit.</span>
                                </label>
                                <label class="switch">
                                    <input type="checkbox" id="selfDestruct">
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="glass-card result-card" id="resultCard">
                <div class="result-header">
                    <p class="success-text">Link successfully shortened!</p>
                </div>
                <div class="result-body">
                    <div class="short-url-group">
                        <a href="#" class="short-url" id="generatedUrl">slice.link/glow-up</a>
                        <button class="btn btn-secondary copy-btn" id="copyBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy
                        </button>
                    </div>
                    
                    <div class="result-extras">
                        <div class="qr-placeholder">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><rect x="7" y="7" width="3" height="3"></rect><rect x="14" y="7" width="3" height="3"></rect><rect x="7" y="14" width="3" height="3"></rect><rect x="14" y="14" width="3" height="3"></rect></svg>
                            <span>QR Code</span>
                        </div>
                        <div class="share-actions">
                            <span class="share-text">Share:</span>
                            <button class="icon-btn x-twitter" aria-label="Share on X">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                            </button>
                            <button class="icon-btn whatsapp" aria-label="Share on WhatsApp">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="loginModal">
        <div class="glass-card modal-content">
            <button class="close-modal" id="closeModal">&times;</button>
            <h2 style="margin-bottom: 8px;">Sign In to Slice</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px;">Track your links and view advanced analytics.</p>
            <form id="loginForm">
                <input type="email" placeholder="Email Address" required style="margin-bottom: 16px;">
                <input type="password" placeholder="Password" required style="margin-bottom: 24px;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Access Dashboard</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
